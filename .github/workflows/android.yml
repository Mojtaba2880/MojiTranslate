name: Android APK

on:
  push:
    branches: ["main", "setup/android-starter"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Install Android platform
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Validate installable APK
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MojiTranslate-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
