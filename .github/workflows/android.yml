name: Android APK

on:
  push:
    branches: ["main", "setup/android-starter"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Install Android platform
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Run unit tests
        run: gradle testDebugUnitTest
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Validate installable APK and record release evidence
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          OUT=app/build/outputs/apk/debug
          test -s "$APK"
          unzip -t "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" 2>&1 | tee "$OUT/apk-signature.txt"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee "$OUT/apk-metadata.txt"
          grep -F "package: name='com.mojtaba.mojitranslate' versionCode='1' versionName='0.3.0'" "$OUT/apk-metadata.txt"
          sha256sum "$APK" | tee "$OUT/SHA256SUMS.txt"
          {
            echo "Repository: $GITHUB_REPOSITORY"
            echo "Branch: $GITHUB_REF_NAME"
            echo "Commit: $GITHUB_SHA"
            echo "Artifact: installable debug APK"
            echo "Package: com.mojtaba.mojitranslate"
            echo "Version: 0.3.0 (code 1)"
          } > "$OUT/validation-manifest.txt"
      - name: Upload APK and validation evidence
        uses: actions/upload-artifact@v4
        with:
          name: MojiTranslate-debug-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/apk-signature.txt
            app/build/outputs/apk/debug/apk-metadata.txt
            app/build/outputs/apk/debug/SHA256SUMS.txt
            app/build/outputs/apk/debug/validation-manifest.txt
          if-no-files-found: error
